<mat-button-toggle-group
  hideSingleSelectionIndicator
  aria-label="drawing tool"
  [value]="tool()"
  [disabled]="disabled()"
  (change)="onChange($event)"
>
  @for (t of tools(); track t.id) {
  <mat-button-toggle
    [value]="t.id"
    [matTooltip]="t.tip"
    [aria-label]="t.tip"
  >
    <mat-icon>{{ t.icon }}</mat-icon>
  </mat-button-toggle>
  }
</mat-button-toggle-group>
