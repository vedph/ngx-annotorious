<div class="gallery" [class.with-filter]="filterVisible()">
  <div class="progress">
    @if (loading()) {
    <mat-progress-bar mode="indeterminate" />
    }
  </div>

  @if (filterVisible()) {
  <aside class="filter">
    <cadmus-gallery-filter [entries]="entries()" />
  </aside>
  }

  <section class="frame" aria-label="images" [attr.aria-busy]="loading()">
    @if (error(); as message) {
    <p class="message error" role="alert">{{ message }}</p>
    } @if (page().items.length) {
    <ul class="images">
      @for (img of page().items; track img.id) {
      <li>
        <figure
          class="image"
          [class.selected]="img.id === selectedId()"
          [style.width.px]="thumbWidth()"
        >
          <button
            type="button"
            class="thumb"
            [attr.aria-label]="'pick ' + img.title"
            (click)="pickImage(img)"
          >
            <img
              [src]="img.uri"
              [alt]="img.title"
              [width]="thumbWidth()"
              [style.max-height.px]="thumbHeight()"
              loading="lazy"
              decoding="async"
            />
          </button>
          <figcaption>
            <span class="title">{{ img.title }}</span>
            @if (img.description) {
            <span class="dsc">{{ img.description }}</span>
            }
          </figcaption>
        </figure>
      </li>
      }
    </ul>
    } @else if (!loading() && !error()) {
    <p class="message">No images.</p>
    }
  </section>

  <div class="paginator">
    <button
      type="button"
      mat-icon-button
      class="mat-warn"
      matTooltip="Reload images and clear filters"
      aria-label="reload images"
      (click)="reset()"
    >
      <mat-icon>autorenew</mat-icon>
    </button>
    <mat-paginator
      [length]="page().total"
      [pageIndex]="page().pageNumber ? page().pageNumber - 1 : 0"
      [pageSize]="page().pageSize"
      [pageSizeOptions]="sizeOptions()"
      [showFirstLastButtons]="true"
      (page)="onPageChange($event)"
    />
  </div>
</div>
