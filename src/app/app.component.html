<header>
  <mat-toolbar class="bg-mat-primary">
    <span class="logo"><img src="./img/logo-white-40.png" alt="Fusisoft" /></span>
    <a mat-button routerLink="/home" routerLinkActive="active">Home</a>
    <button type="button" mat-button [matMenuTriggerFor]="otherMenu">
      Other
    </button>
    <mat-menu #otherMenu>
      <a mat-menu-item routerLink="/other/toolbar">Image annotator toolbar</a>
      <a mat-menu-item routerLink="/other/img-gallery">Image gallery</a>
      <a mat-menu-item routerLink="/osd/annotator">OSD annotator</a>
    </mat-menu>
    <span class="spacer"></span>
    <button
      type="button"
      mat-icon-button
      [matTooltip]="darkMode() ? 'Light theme' : 'Dark theme'"
      [attr.aria-label]="darkMode() ? 'switch to light theme' : 'switch to dark theme'"
      (click)="toggleTheme()"
    >
      <mat-icon>{{ darkMode() ? "light_mode" : "dark_mode" }}</mat-icon>
    </button>
  </mat-toolbar>
</header>

<main>
  <router-outlet />
</main>

<footer>
  Annotorious Wrapper for Cadmus bricks {{ version }} by
  <a rel="noopener" href="http://www.fusisoft.it" target="_blank">Daniele Fusi</a>
</footer>
