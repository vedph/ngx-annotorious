<form (submit)="save($event)">
  <mat-form-field class="text-field">
    <mat-label>text</mat-label>
    <textarea
      matInput
      rows="3"
      [formField]="editForm.text"
      (keydown.control.enter)="save($event)"
    ></textarea>
    <mat-hint>Ctrl+Enter = save</mat-hint>
    @if (editForm.text().touched() && editForm.text().invalid()) {
    <mat-error>{{ editForm.text().errors()[0]?.message }}</mat-error>
    }
  </mat-form-field>
  <div class="actions">
    <button type="button" mat-stroked-button (click)="close()">
      <mat-icon>cancel</mat-icon>
      cancel
    </button>
    <button
      type="submit"
      mat-flat-button
      [disabled]="editForm().invalid()"
    >
      <mat-icon>check_circle</mat-icon>
      save
    </button>
  </div>
</form>
