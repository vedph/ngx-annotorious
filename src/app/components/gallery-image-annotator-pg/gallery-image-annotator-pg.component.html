<div class="page">
  <mat-tab-group
    [selectedIndex]="tabIndex()"
    (selectedIndexChange)="tabIndex.set($event)"
  >
    <!-- annotator -->
    <mat-tab label="Annotator">
      <div class="annotator">
        @if (image(); as img) {
        <div class="image">
          <img-annotator-toolbar [(tool)]="tool" />
          <img
            imgAnnotator
            #ann="imgAnnotator"
            [alt]="img.title"
            [src]="img.uri"
            [tool]="tool()"
          />
        </div>
        <div class="list">
          <app-my-img-annotation-list
            [image]="img"
            [annotator]="ann.annotator()"
            [editorComponent]="editor"
            (listInit)="list.set($event)"
          />

          <form class="dump" (submit)="setAnnotations($event)">
            <mat-form-field class="json">
              <mat-label>annotations JSON</mat-label>
              <textarea
                matInput
                rows="10"
                [formField]="dumpForm.json"
              ></textarea>
              @if (jsonError(); as error) {
              <mat-hint class="error">{{ error }}</mat-hint>
              }
            </mat-form-field>
            <div class="form-row">
              <mat-checkbox [formField]="dumpForm.frozen">frozen</mat-checkbox>
              <button
                mat-flat-button
                type="submit"
                class="mat-warn"
                matTooltip="Set annotations from JSON"
              >
                <mat-icon>check_circle</mat-icon>
                set
              </button>
            </div>
          </form>
        </div>
        } @else {
        <p class="muted">Pick an image from the gallery.</p>
        }
      </div>
    </mat-tab>
    <!-- gallery -->
    <mat-tab label="Gallery">
      <cadmus-gallery-list
        [entries]="entries"
        [selectedId]="image()?.id"
        (imagePick)="onImagePick($event)"
      />
    </mat-tab>
  </mat-tab-group>
</div>
