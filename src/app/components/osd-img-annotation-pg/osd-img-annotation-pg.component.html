<div class="page">
  <mat-card appearance="outlined">
    <mat-card-header>
      <mat-card-title>OSD Image Annotator</mat-card-title>
      <mat-card-subtitle>
        Toggle drawing off to pan and zoom the image.
      </mat-card-subtitle>
    </mat-card-header>
    <mat-card-content>
      <div class="annotator">
        <div class="image">
          <div class="form-row">
            <img-annotator-toolbar
              [(tool)]="tool"
              [disabled]="!drawingEnabled()"
            />
            <mat-slide-toggle
              [checked]="drawingEnabled()"
              (change)="drawingEnabled.set($event.checked)"
              >drawing</mat-slide-toggle
            >
          </div>
          <div
            class="osd-container"
            osdImgAnnotator
            #osd="osdImgAnnotator"
            height="500px"
            [tool]="tool()"
            [drawingEnabled]="drawingEnabled()"
          >
            <img alt="canyon" src="canyon.jpg" />
          </div>
        </div>
        <div class="list">
          <ann-basic-img-annotation-list
            [annotator]="osd.annotator()"
            [editorComponent]="editor"
            [image]="image"
            (listInit)="list.set($any($event))"
          />
        </div>
      </div>
    </mat-card-content>
    <mat-card-actions align="end">
      <button
        type="button"
        mat-flat-button
        class="mat-warn"
        [disabled]="!list()?.annotations()?.length"
        (click)="clearAnnotations()"
      >
        <mat-icon>delete_sweep</mat-icon>
        clear
      </button>
    </mat-card-actions>
  </mat-card>
</div>
