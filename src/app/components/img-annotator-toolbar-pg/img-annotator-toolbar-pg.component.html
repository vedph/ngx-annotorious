<div class="page">
  <mat-card appearance="outlined">
    <mat-card-header>
      <mat-card-title>Image Annotator Toolbar</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <div class="form-row">
        <img-annotator-toolbar [(tool)]="tool" [tools]="tools()" />
        <mat-slide-toggle
          [checked]="extended()"
          (change)="extended.set($event.checked)"
          >more tools</mat-slide-toggle
        >
      </div>
      <p>selected tool: {{ tool() }}</p>
    </mat-card-content>
  </mat-card>
</div>
