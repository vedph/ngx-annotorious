@if (annotations().length) {
<table>
  <thead>
    <tr>
      <th></th>
      <th>annotation</th>
      <th class="noif-lt-md">ID</th>
    </tr>
  </thead>
  <tbody>
    @for (a of annotations(); track a.id; let i = $index) {
    <tr [class.selected]="i === selectedIndex()">
      <td class="fit-width">
        <button
          type="button"
          mat-icon-button
          matTooltip="Select annotation"
          (click)="toggleSelection(a)"
        >
          <mat-icon>{{
            i === selectedIndex() ? "check_circle" : "radio_button_unchecked"
          }}</mat-icon>
        </button>
        <button
          type="button"
          mat-icon-button
          class="mat-primary"
          matTooltip="Edit annotation"
          (click)="editAnnotationAt(i)"
        >
          <mat-icon>edit</mat-icon>
        </button>
        <button
          type="button"
          mat-icon-button
          class="mat-warn"
          matTooltip="Remove annotation"
          (click)="removeAnnotationAt(i)"
        >
          <mat-icon>delete</mat-icon>
        </button>
        <button
          type="button"
          mat-icon-button
          matTooltip="Dump to console"
          (click)="dump(i)"
        >
          <mat-icon>bug_report</mat-icon>
        </button>
      </td>
      <td>{{ annotationToString()(a) }}</td>
      <td class="muted noif-lt-md">{{ a.id }}</td>
    </tr>
    }
  </tbody>
</table>
} @else {
<p class="muted">No annotations.</p>
}
